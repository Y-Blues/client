[project]
name = "ycappuccino-client"
version = "0.1.0"
description = "YCappuccino pyscript client: thin async HTTP client and shared @Item models, usable under Pyodide in the browser or in plain CPython for testing"
requires-python = ">=3.10"
dependencies = [
    "ycappuccino-api",
    "ycappuccino-core",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ycappuccino.client"
module-root = "src/main/python"

[tool.uv.sources]
ycappuccino-api = { path = "../api", editable = true }
ycappuccino-core = { path = "../core", editable = true }
