<!DOCTYPE html>
<!--
  Generic page starting a client YCappuccino Framework in the browser (Pyodide), described by
  ./ycappuccino.json next to it:

    {"name": "admin",
     "wheels": ["wheels/ycappuccino_api-0.1.0-py3-none-any.whl", "..."],
     "bundles": ["ycappuccino.ui_web.page", "myapp"],
     "components": {"PyodidePage": {"mount_selector": "#app"}}}

  Serve it on the same origin as the backend's /api. The application's components draw into #app.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YCappuccino</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
</head>
<body>
  <div id="app"></div>
  <p id="ycappuccino-status" role="status">Loading…</p>
  <script>
    const status = (text) => { document.getElementById("ycappuccino-status").textContent = text; };
    (async () => {
      try {
        const application = await (await fetch("./ycappuccino.json")).json();
        const pyodide = await loadPyodide();
        await pyodide.loadPackage(["micropip", "pyyaml"]);
        pyodide.globals.set("application", pyodide.toPy(application));
        pyodide.globals.set("status", status);
        await pyodide.runPythonAsync(`
import micropip

status("Installing packages…")
await micropip.install("iPOPO>=3.0")
for wheel in application["wheels"]:
    await micropip.install(wheel, deps=False)

status("Starting the framework…")
from ycappuccino.client.bootstrap import start_client

await start_client(
    application["name"], application["bundles"], application.get("components"), root="/home/pyodide/app"
)
status("")
`);
      } catch (error) {
        status("Error: " + error);
        console.error(error);
      }
    })();
  </script>
</body>
</html>
